services:
  mysql-dev:
    image: mysql:8.4
    container_name: estoque-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./mysql/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-prod:
    image: mysql:8.4
    container_name: estoque-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_prod
    ports:
      - "3307:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./mysql/init-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    build: ./rabbitmq
    container_name: estoque-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  servico-movimentacao:
    build: ./servico-movimentacao
    container_name: estoque-servico-movimentacao
    restart: unless-stopped
    depends_on:
      mysql-dev:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-dev:3306/movimentacao_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  aplicacao-principal:
    build: ./aplicacao-principal
    container_name: estoque-aplicacao-principal
    restart: unless-stopped
    depends_on:
      mysql-dev:
        condition: service_healthy
      servico-movimentacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: jdbc:mysql://mysql-dev:3306/estoque_principal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root_dev
      JPA_DDL_AUTO: none

      SERVICO_COMUNICACAO_URL: http://servico-movimentacao:8081

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  mysql-dev-data:
  mysql-prod-data:
