spring.config.import=optional:classpath:env.prod[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/estoque_principal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:estoque_prod}
spring.datasource.password=${DB_PASSWORD:estoque_prod}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false