spring.config.import=optional:classpath:env.dev[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/estoque_principal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:estoque_dev}
spring.datasource.password=${DB_PASSWORD:estoque_dev}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true